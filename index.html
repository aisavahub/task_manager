<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Task Manager</h1>

  <form id="taskForm" novalidate>
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="Task title">
      <span class="error" id="titleError"></span>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="category">Category</label>
        <select id="category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="School">School</option>
        </select>
      </div>

      <div class="field">
        <label for="dueDate">Due Date</label>
        <input type="date" id="dueDate">
      </div>

      <div class="field">
        <label for="priority">Priority</label>
        <select id="priority">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>
      </div>
    </div>

    <button type="submit">Add Task</button>
  </form>

 <div class="filters">
    <div class="status-filters">
      <button type="button" class="status-btn active" data-status="All">All</button>
      <button type="button" class="status-btn" data-status="Active">Active</button>
      <button type="button" class="status-btn" data-status="Completed">Completed</button>
    </div>
 
    <select id="categoryFilter">
      <option value="All">All Categories</option>
      <option value="Personal">Personal</option>
      <option value="Work">Work</option>
      <option value="School">School</option>
    </select>
  </div>
 
  <p id="statsLine"></p>
 

  <ul id="taskList"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
